[build-system]
# Fix: use setuptools.build_meta, not the non-existent setuptools.backends.legacy
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name    = "kelp-segmentation"
version = "0.1.0"
description = "Binary kelp / no-kelp semantic segmentation on Sentinel-2 imagery."
readme  = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0",
    "torchvision",
    "pytorch-lightning>=2.0",
    "segmentation-models-pytorch>=0.3",
    "albumentations>=1.3",
    "rasterio>=1.3",
    # numpy<2 required: several compiled extensions (rasterio, smp, …) are
    # built against NumPy 1.x and crash at import under NumPy 2.x.
    "numpy<2",
    "scikit-learn>=1.2",
    "mlflow>=2.0",
    "tqdm",
    "pyyaml",
    # GDAL is intentionally excluded from this list.
    # Install it manually before running `pip install -e .` — see README.
    "tifffile",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
