name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── System dependencies (GDAL, rasterio) ──────────────────────────────
      # Ubuntu ships GDAL via apt; this avoids the wheel-build failure that
      # occurs on Windows when GDAL is installed from PyPI source.
      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin python3-gdal

      # ── Python dependencies ────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=64" wheel
          # Install GDAL Python bindings against the system GDAL
          GDAL_VERSION=$(gdal-config --version)
          pip install "GDAL==${GDAL_VERSION}"
          # Install the rest of the project (CPU-only torch for CI speed)
          pip install \
            torch==2.2.2 torchvision==0.17.2 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint with ruff
        run: ruff check src/ tests/ inference.py

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=src --cov=inference \
            --cov-report=term-missing \
            --cov-report=xml

      # ── Upload coverage ────────────────────────────────────────────────────
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
